<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optimizer Visualizer & Benchmark Suite</title>
    <style>
      .initial-loader-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #10141A;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .initial-loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(231, 234, 238, 0.1);
        border-radius: 50%;
        border-top-color: #58A6FF;
        animation: initial-loader-spin 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        margin-bottom: 16px;
      }
      .initial-loader-text {
        color: #E7EAEE;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.5px;
        animation: initial-loader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
    </style>
  </head>
  <body class="bg-[#10141A] text-[#E7EAEE]">
    <div id="root">
      <div class="initial-loader-container">
        <div class="initial-loader-spinner"></div>
        <div class="initial-loader-text">Loading Visualizer...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
